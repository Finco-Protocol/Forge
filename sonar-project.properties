# SonarQube Cloud configuration for the FORGE application only (free / public-project plan).
#
# DELIBERATELY ABSENT: sonar.organization and sonar.projectKey. They are repository-specific values created when a
# repository administrator imports THIS repository (only) in SonarQube Cloud; they are supplied to CI as the
# repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY (and the secret SONAR_TOKEN) - never invented here.
# See docs/SECURITY-TOOLCHAIN.md. Do not enable organisation-wide import.
#
# SonarQube Cloud's free analysers cover TypeScript/JavaScript, Python and workflow/IaC files; Solidity is covered
# by Slither/Aderyn instead.
sonar.sourceEncoding=UTF-8

sonar.sources=apps/forge-web/src,apps/forge-web/scripts,scripts,security,semgrep,.github
sonar.tests=apps/forge-web/test
sonar.test.inclusions=apps/forge-web/test/**

# Generated, compiled and vendored-only files. Forge-owned source is NOT excluded and no vulnerability is
# suppressed with sonar.issue.ignore rules.
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/cache/**,apps/forge-web/src/shared/abis.generated.ts,apps/forge-web/test-results/**,apps/forge-web/playwright-report/**,security/baseline.json,**/*.sol
sonar.coverage.exclusions=apps/forge-web/test/**,apps/forge-web/scripts/**,scripts/**,security/**,semgrep/**

# Fixtures that intentionally contain insecure patterns for Semgrep rule tests.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=semgrep/forge-rules.ts

sonar.javascript.lcov.reportPaths=apps/forge-web/coverage/lcov.info
