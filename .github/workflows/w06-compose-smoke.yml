name: W06 Staging Compose Smoke (manual)

# MANUAL ONLY. Builds and starts ops/staging/docker-compose.staging.yml on a GitHub runner (which has Docker) and
# exercises startup, confinement, crash recovery, persistence and backup/restore. It is deliberately NOT part of the
# required exact-head checks (a manual smoke must never silently gate a merge): run it from the Actions tab and
# attach the result (run id + SHA) to the readiness evidence.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: ops/staging/docker-compose.staging.yml

jobs:
  compose-smoke:
    name: "w06/w07: staging compose smoke + recovery + backup/restore"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: env file (test-only values; fresh random secrets)
        run: |
          cp ops/staging/.env.staging.example ops/staging/.env.staging
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "FORGE_OPS_TOKEN=$(openssl rand -hex 24)"
            echo "GITHUB_WEBHOOK_SECRET=$(openssl rand -hex 24)"
          } > /tmp/secrets.env
          grep -v -E '^(POSTGRES_PASSWORD|SESSION_SECRET|FORGE_OPS_TOKEN|GITHUB_WEBHOOK_SECRET)=' ops/staging/.env.staging > /tmp/keys.env
          cat /tmp/secrets.env /tmp/keys.env > ops/staging/.env.staging
      # Correction A 4.1: confinement is decided from the PARSED compose config, before any
      # application container starts. A textual grep missed the quoted "31337".
      - name: W07 chain-write confinement (parsed config, BEFORE startup)
        run: |
          docker compose --env-file ops/staging/.env.staging config >/tmp/resolved.yaml
          FORGE_CHAIN_ID=$(grep -m1 'FORGE_CHAIN_ID:' /tmp/resolved.yaml | tr -d '" ' | cut -d: -f2)
          RPC=$(grep -m1 'FORGE_RPC_URL:' /tmp/resolved.yaml | tr -d '" ' | cut -d: -f2-)
          [ "$FORGE_CHAIN_ID" = "31337" ] || { echo "::error::compose resolves FORGE_CHAIN_ID=$FORGE_CHAIN_ID (expected 31337)"; exit 1; }
          case "$RPC" in
            http://anvil:8545) ;;
            *) echo "::error::compose resolves FORGE_RPC_URL=$RPC (expected the internal anvil)"; exit 1;;
          esac
          if grep -qE 'rpc\.mainnet\.chain\.robinhood\.com|FORK_URL|chainlist|infura|alchemy' /tmp/resolved.yaml ops/staging/.env.staging; then
            echo "::error::an external chain endpoint appears in the resolved config"; exit 1
          fi
          echo "confinement OK: chain 31337 via the internal anvil only, no external chain endpoint"
      - name: up
        run: |
          docker compose --env-file ops/staging/.env.staging up --build -d \
            || { docker compose --env-file ops/staging/.env.staging logs --no-color | tail -300; exit 1; }
      - name: wait for readiness (web + worker + indexer + ledger)
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/ready; then echo; exit 0; fi
            sleep 5
          done
          docker compose --env-file ops/staging/.env.staging logs --no-color | tail -200
          exit 1
      # Correction B 3: a REAL unexpected process crash. `docker kill` is recorded by the
      # daemon as a manual stop (verified: Running=false, RestartCount stays 0 forever), so
      # the drill SIGKILLs the container's HOST PID from the runner instead - outside the
      # Docker stop/kill API, indistinguishable from an OOM/host crash. The restart policy
      # must then recreate the process; no docker compose start/restart is used.
      - name: W07 worker crash drill (host-level SIGKILL) and automatic recovery
        run: |
          WORKER=$(docker compose --env-file ops/staging/.env.staging ps -q worker)
          HOSTPID=$(docker inspect --format '{{.State.Pid}}' "$WORKER")
          BEFORE_START=$(docker inspect --format '{{.State.StartedAt}}' "$WORKER")
          BEFORE_RESTARTS=$(docker inspect --format '{{.RestartCount}}' "$WORKER")
          OPS_TOKEN=$(grep '^FORGE_OPS_TOKEN=' ops/staging/.env.staging | head -1 | cut -d= -f2)
          DB_COUNTS() {
            docker compose --env-file ops/staging/.env.staging exec -T postgres psql -U forge -d forge_staging -tAc               "SELECT (SELECT count(*) FROM chain_events) || ':' || (SELECT count(*) FROM webhook_deliveries) || ':' || (SELECT count(*) FROM jobs)"
          }
          BEFORE_COUNTS=$(DB_COUNTS)
          echo "worker $WORKER host-pid $HOSTPID starts $BEFORE_START restarts $BEFORE_RESTARTS counts $BEFORE_COUNTS"
          sudo kill -9 "$HOSTPID"
          OBSERVED=""
          for _ in $(seq 1 36); do
            STATE=$(docker inspect --format '{{.State.Running}} {{.RestartCount}} {{.State.StartedAt}}' "$WORKER")
            RD=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready || true)
            OBSERVED="$OBSERVED $RD"
            set -- $STATE
            RUNNING=$1; RESTARTS=$2; START=$3
            if [ "$RUNNING" = "true" ] && [ "$START" != "$BEFORE_START" ] && [ "$RESTARTS" -gt "$BEFORE_RESTARTS" ] && [ "$RD" = "200" ]; then
              AFTER_COUNTS=$(DB_COUNTS)
              WH=$(curl -fsS -H "Authorization: Bearer $OPS_TOKEN" http://127.0.0.1:3000/api/ops/health | grep -o '"worker":{"ok":[a-z]*' | head -1)
              echo "recovered: state '$STATE'; readiness observed [$OBSERVED ]; worker health $WH"
              [ "$AFTER_COUNTS" = "$BEFORE_COUNTS" ] || { echo "::error::ledger/webhook/job state changed across the crash ($BEFORE_COUNTS -> $AFTER_COUNTS)"; exit 1; }
              echo "$WH" | grep -q 'ok":true' || { echo "::error::worker heartbeat not healthy after recovery"; exit 1; }
              echo "restart-policy recovery proven; no duplicate indexing, webhook effects or ledger mutations"
              exit 0
            fi
            sleep 5
          done
          echo "::error::worker did not automatically recover; readiness observed [$OBSERVED ]"
          docker inspect --format '{{json .State}}' "$WORKER"
          docker compose --env-file ops/staging/.env.staging logs --no-color worker | tail -100
          exit 1
      # Correction A 4.3: persistence is proven by DATA, not by a 200 — key tables and
      # the indexer checkpoint must be identical across the restart.
      - name: W07 PostgreSQL restart (persistence proven by data equality)
        run: |
          SNAPSHOT() {
            docker compose --env-file ops/staging/.env.staging exec -T postgres psql -U forge -d forge_staging -tAc \
              "SELECT (SELECT count(*) FROM chain_events) || ':' || (SELECT count(*) FROM indexer_checkpoints) || ':' || (SELECT count(*) FROM ledger_snapshots) || ':' || coalesce((SELECT max(last_block::text) FROM indexer_checkpoints),'0')"
          }
          BEFORE=$(SNAPSHOT)
          [ "$BEFORE" != "0:0:0:0" ] || { echo "::error::nothing persisted before the restart"; exit 1; }
          docker compose --env-file ops/staging/.env.staging restart postgres
          for _ in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then
              AFTER=$(SNAPSHOT)
              [ "$AFTER" = "$BEFORE" ] || { echo "::error::data changed across the postgres restart ($BEFORE -> $AFTER)"; exit 1; }
              echo "postgres restarted; persistence proven ($AFTER); web+worker reconnected"
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file ops/staging/.env.staging logs --no-color | tail -200
          exit 1
      # Correction A 4.4: REAL compose-level backup -> restore into a SECOND database ->
      # canonical ledger digest agreement (closes the W07 handover E1 carryover).
      - name: W07 backup -> restore into a second database -> ledger digest agreement
        run: |
          PG_PW=$(grep '^POSTGRES_PASSWORD=' ops/staging/.env.staging | head -1 | cut -d= -f2)
          # snapshot wants a quiet database (the sidecar digest must describe the dump)
          docker compose --env-file ops/staging/.env.staging stop worker
          docker compose --env-file ops/staging/.env.staging exec -T postgres pg_dump -U forge -Fc forge_staging > backup.dump
          docker compose --env-file ops/staging/.env.staging exec -T postgres createdb -U forge forge_restore
          docker compose --env-file ops/staging/.env.staging exec -T postgres pg_restore -U forge -d forge_restore --no-owner < backup.dump
          ORIG=$(docker compose --env-file ops/staging/.env.staging run --rm --no-deps web pnpm exec tsx scripts/w06/staging-ops.ts snapshot /tmp/o.dump | tail -1)
          REST=$(docker compose --env-file ops/staging/.env.staging run --rm --no-deps -e "DATABASE_URL=postgres://forge:${PG_PW}@postgres:5432/forge_restore" web pnpm exec tsx scripts/w06/staging-ops.ts snapshot /tmp/r.dump | tail -1)
          echo "original: $ORIG"
          echo "restored: $REST"
          OD=$(echo "$ORIG" | grep -o '"ledgerDigest":"[^"]*"' | cut -d'"' -f4)
          RD=$(echo "$REST" | grep -o '"ledgerDigest":"[^"]*"' | cut -d'"' -f4)
          [ -n "$OD" ] || { echo "::error::no ledger digest from the original database"; exit 1; }
          [ "$OD" = "$RD" ] || { echo "::error::ledger digest mismatch after restore ($OD vs $RD)"; exit 1; }
          echo "ledger digest agreement proven: $OD"
          docker compose --env-file ops/staging/.env.staging start worker
      - name: down
        if: always()
        run: docker compose --env-file ops/staging/.env.staging down -v
