# FINCO Forge security toolchain (free tools only, this repository only).
#   Slither + Aderyn  -> Forge-owned Solidity (full dependency graph analysed, vendored paths not reported)
#   Semgrep CE        -> app code, scripts, workflows (community rules + project rules; no Semgrep token)
#   Unified report    -> normalised findings, baseline triage, policy gate
# CodeQL (default setup), CodeRabbit and SonarQube Cloud need repository-administrator authorisation: see
# docs/SECURITY-TOOLCHAIN.md. Nothing here deploys, signs or merges anything.
name: Security Toolchain

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly, catches new rules / advisories on an unchanged tree
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.5
  SLITHER_VERSION: "0.11.6"
  ADERYN_VERSION: "0.6.8"
  SEMGREP_VERSION: "1.181.0"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: "security: change detection"
    runs-on: ubuntu-latest
    outputs:
      solidity: ${{ steps.detect.outputs.solidity }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            sol=false; app=false
            if echo "$files" | grep -Eq '^(contractsV2-forge/|foundry\.toml|foundry\.lock|contractsV2-deployed/|security/|\.github/workflows/security-toolchain\.yml)'; then sol=true; fi
            if echo "$files" | grep -Eq '^(apps/forge-web/(src|scripts|package\.json|pnpm-lock\.yaml)|scripts/|\.github/|semgrep/|security/)'; then app=true; fi
          else
            sol=true; app=true   # push to main, weekly schedule, manual run: scan everything
          fi
          echo "solidity=$sol" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "solidity=$sol app=$app" | tee -a "$GITHUB_STEP_SUMMARY"

  solidity:
    name: "security: Solidity (Slither + Aderyn)"
    needs: changes
    if: needs.changes.outputs.solidity == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: forge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: install pinned scanners
        run: |
          set -euo pipefail
          python -m pip install --quiet "slither-analyzer==${SLITHER_VERSION}"
          npm install --global "@cyfrin/aderyn@${ADERYN_VERSION}"
          slither --version
          aderyn --version
      - name: Slither (compiles the approved `forge` profile once; vendored paths analysed but not reported)
        run: |
          set -euo pipefail
          mkdir -p security-out
          # --fail-none: Slither's exit code is the number of findings; a CRASH is detected from the report
          # (success=false / missing file) by security/report.mjs, never mistaken for a clean scan.
          slither . --foundry-out-directory out/forge --fail-none \
            --filter-paths "contractsV2-deployed/lib|contractsV2/lib|test-forge" \
            --json security-out/slither.json --sarif security-out/slither.sarif \
            2>&1 | tee security-out/slither.log
          test -s security-out/slither.json
      - name: Aderyn (reuses the artifacts compiled above)
        run: |
          set -euo pipefail
          aderyn . --src contractsV2-forge/src -o security-out/aderyn.json 2>&1 | tee security-out/aderyn.log
          aderyn . --src contractsV2-forge/src -o security-out/aderyn.sarif >/dev/null
          aderyn . --src contractsV2-forge/src -o security-out/aderyn.md >/dev/null
          test -s security-out/aderyn.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-solidity
          path: security-out/
          if-no-files-found: error

  appsec:
    name: "security: application (Semgrep CE)"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install pinned Semgrep CE
        run: |
          set -euo pipefail
          python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep --version
      - name: project rule tests (every custom rule has flagged + clean fixtures)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep --test --metrics=off --disable-version-check semgrep/
      - name: Semgrep scan (community packs + project rules; no token, metrics off)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -euo pipefail
          mkdir -p security-out
          semgrep scan --metrics=off --disable-version-check \
            --config p/typescript --config p/nextjs --config p/github-actions --config p/secrets \
            --config p/owasp-top-ten --config p/jwt --config p/python \
            --config semgrep/forge-rules.yml \
            --json-output security-out/semgrep.json --sarif-output security-out/semgrep.sarif \
            apps/forge-web/src apps/forge-web/scripts scripts .github security 2>&1 | tee security-out/semgrep.log
          test -s security-out/semgrep.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-appsec
          path: security-out/
          if-no-files-found: error

  workflows:
    name: "security: GitHub Actions workflows (actionlint + zizmor, any finding fails)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: actionlint + zizmor (offline; unpinned actions, excess permissions, template injection, credential persistence)
        run: |
          set -euo pipefail
          python -m pip install --quiet "actionlint-py==1.7.7.24" "zizmor==1.31.0"
          actionlint .github/workflows/*.yml
          # gate: medium and above fail; the one known low (adhoc-packages: the pinned Aderyn npm CLI has no lockfile) is documented, not silenced
          zizmor --offline --pedantic --format plain --min-severity medium .github/workflows

  sarif:
    # Only this job holds `security-events: write`. It runs no scanner and no third-party tool besides the pinned
    # upload action: it re-uploads SARIF files produced (without any write token) by the scanner jobs.
    name: "security: SARIF upload to code scanning (no scanner runs here)"
    needs: [solidity, appsec]
    if: always() && (needs.solidity.result == 'success' || needs.appsec.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.solidity.result == 'success'
        with:
          name: security-solidity
          path: sarif-in/solidity
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.appsec.result == 'success'
        with:
          name: security-appsec
          path: sarif-in/appsec
      - name: upload Slither SARIF to GitHub code scanning
        id: sarif_slither
        if: needs.solidity.result == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: sarif-in/solidity/slither.sarif
          category: slither
      - name: upload Aderyn SARIF to GitHub code scanning
        id: sarif_aderyn
        if: needs.solidity.result == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: sarif-in/solidity/aderyn.sarif
          category: aderyn
      - name: upload Semgrep SARIF to GitHub code scanning
        id: sarif_semgrep
        if: needs.appsec.result == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: sarif-in/appsec/semgrep.sarif
          category: semgrep
      - name: SARIF integration status
        if: always()
        env:
          SLITHER_OUTCOME: ${{ steps.sarif_slither.outcome }}
          ADERYN_OUTCOME: ${{ steps.sarif_aderyn.outcome }}
          SEMGREP_OUTCOME: ${{ steps.sarif_semgrep.outcome }}
        run: |
          {
            echo "### SARIF -> GitHub code scanning"
            echo "- Slither: \`${SLITHER_OUTCOME}\`"
            echo "- Aderyn: \`${ADERYN_OUTCOME}\`"
            echo "- Semgrep: \`${SEMGREP_OUTCOME}\`"
            echo "(A failed upload on a private repository without Code Security, or on a fork PR, is reported here and does not hide scanner results; the policy gate is the report job.)"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: "security: unified report + policy gate (new critical/high in Forge-owned code blocks)"
    needs: [changes, solidity, appsec]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: scan-in
          pattern: security-*
          merge-multiple: true
      - name: decide which scanners are REQUIRED (a crashed or missing scanner is never a clean scan)
        id: req
        env:
          SOL: ${{ needs.solidity.result }}
          APP: ${{ needs.appsec.result }}
          CHG: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          for r in "$CHG" "$SOL" "$APP"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a scanner or setup job ended '$r' - that is a failure, not a clean scan"; exit 2 ;;
            esac
          done
          req=""
          [ "$SOL" = "success" ] && req="slither,aderyn"
          [ "$APP" = "success" ] && req="${req:+$req,}semgrep"
          echo "required=$req" >> "$GITHUB_OUTPUT"
          if [ -z "$req" ]; then echo "::notice::no security-relevant paths changed; no scanner was required"; fi
      - name: cloud-service connection status (informational)
        id: cloud
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -u
          nc=""
          state="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" --jq .state 2>/dev/null || echo UNKNOWN)"
          echo "codeql_default_setup=$state"
          [ "$state" = "configured" ] || nc="CodeQL default setup (state: $state; admin must enable)"
          [ -n "$SONAR_KEY" ] || nc="${nc:+$nc,}SonarQube Cloud (repository variable SONAR_PROJECT_KEY unset; admin must connect)"
          echo "not_connected=$nc" >> "$GITHUB_OUTPUT"
      - name: unified report + policy
        if: steps.req.outputs.required != ''
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_REQUIRED: ${{ steps.req.outputs.required }}
          REPORT_NOT_CONNECTED: ${{ steps.cloud.outputs.not_connected }}
        # exit 1 = new critical/high in Forge-owned code; exit 2 = scanner/report/config error (security/ci-report.sh)
        run: bash security/ci-report.sh
      - name: publish summary
        if: always() && steps.req.outputs.required != ''
        run: |
          if [ -f security-report/security-report.md ]; then cat security-report/security-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.req.outputs.required != ''
        with:
          name: security-unified-report
          path: security-report/
          if-no-files-found: error
