name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.5

jobs:
  # ── The passing harness: V2 minus the uncompilable factory, plus tests ──
  build-and-test:
    name: forge build + test (testable profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-action@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Build (testable profile)
        run: forge build --profile testable
      - name: Test (87 tests + invariants)
        run: forge test --profile testable -vvv

  v1-build:
    name: forge build (V1 generation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-action@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build --profile v1

  # ── Upstream source-integrity canary ────────────────────────────────────
  # `forge build` on the full V2 tree is EXPECTED to fail at this HEAD:
  # PonsV2LaunchFactory references PonsV2BondingCurve.exemptFromSnipeTax,
  # which the published curve does not define (docs/BUILD.md, F-01). This
  # job records the failure loudly and alerts when the failure CHANGES —
  # if it goes green, upstream repaired the tree and the canary must be
  # converted into a hard gate. It is NOT a signal that anything is broken
  # by this fork; the fork modifies no production contract.
  canary-full-build:
    name: canary — full V2 build (expected failure, F-01)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-action@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Full build (expected to fail on upstream defect)
        id: build
        continue-on-error: true
        run: forge build > canary.log 2>&1 || true
      - name: Verify the failure is still the known upstream defect
        run: |
          if grep -q 'exemptFromSnipeTax' canary.log; then
            echo "::error::UPSTREAM DEFECT STILL PRESENT (F-01): full V2 tree does not compile — PonsV2LaunchFactory references PonsV2BondingCurve.exemptFromSnipeTax which the published curve does not define. See docs/BUILD.md and docs/SECURITY-REVIEW.md."
            exit 0
          elif grep -qi 'Compiler run successful' canary.log; then
            echo "::error::FULL BUILD NOW SUCCEEDS — upstream repaired the F-01 defect. Convert this canary into a hard gate and extend the test suite to the factory."
            exit 1
          else
            echo "::error::FULL BUILD FAILURE CHANGED — new compiler error, not the known F-01 defect. Investigate:"
            tail -30 canary.log
            exit 1
          fi

  # ── Vendored dependency integrity ───────────────────────────────────────
  dep-integrity:
    name: vendored dependency integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Blob-hash every vendored file against pinned upstream refs
        run: bash scripts/check-vendored-deps.sh

  # ── Static analysis (advisory) ──────────────────────────────────────────
  static-analysis:
    name: forge lint + fmt check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-action@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Lint the first-party sources
        run: forge lint contractsV2/src contractsV1/src || true
      - name: Formatting check (added harness files only; upstream code is untouched)
        run: forge fmt --check test scripts || true
