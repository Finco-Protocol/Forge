name: CI

# Exact-head CI is the final authority for this branch. One consolidated
# workflow; the concurrency group cancels superseded runs so every verdict
# belongs to a live head.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.5

jobs:
  # ── REQUIRED: formatting of Forge-authored files ─────────────────────────
  # Scope is test/ only — 100% Forge-authored. Upstream PONS sources are
  # deliberately NOT reformatted; their formatting is inherited as-is.
  fmt-forge-code:
    name: forge fmt --check (test/, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge fmt --check test

  # ── REQUIRED: the passing harness ────────────────────────────────────────
  build-and-test:
    name: forge build + test (testable profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build --profile testable
      - run: forge test --profile testable -vvv

  # ── REQUIRED: V1 generation compiles ─────────────────────────────────────
  v1-build:
    name: forge build (V1 generation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build --profile v1

  # ── REQUIRED: vendored dependency integrity + negative tests ─────────────
  dep-integrity:
    name: vendored dependency integrity (pinned evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checker negative-test suite (V1–V10)
        run: bash scripts/test-vendor-checker.sh
      - name: Verify the real manifest
        run: bash scripts/check-vendored-deps.sh

  # ── REQUIRED CANARY: full V2 build ───────────────────────────────────────
  # Upstream finding F-01 (docs/SECURITY-REVIEW.md): the published V2 tree
  # cannot compile — PonsV2LaunchFactory references
  # PonsV2BondingCurve.exemptFromSnipeTax, which the published curve does
  # not define. This job does NOT suppress anything: the classifier accepts
  # exactly one verdict — UPSTREAM_V2_FACTORY_BLOCKED — and returns success
  # only for it, so the job is genuinely GREEN for the known defect and
  # genuinely FAILED for unexpected success, new/different compiler errors,
  # infrastructure errors, or ambiguous results. There is no job-level
  # `continue-on-error` here: nothing is neutralized. A green canary is
  # explicitly NOT a passing build of the PONS V2 protocol; the full
  # product remains PRODUCTION_BLOCKED (F-01/F-02).
  canary-full-build:
    name: "canary: full V2 build — UPSTREAM_V2_FACTORY_BLOCKED (F-01, expected; not a passing build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Classifier regression tests (fixtures A–G)
        run: bash scripts/test-canary-classifier.sh
      - name: Full V2 build (capture exit code and log)
        id: build
        run: |
          set +e
          forge build > canary.log 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Classify build result
        env:
          CANARY_EXITCODE: ${{ steps.build.outputs.exitcode }}
        run: |
          bash scripts/canary-classify.sh "$CANARY_EXITCODE" canary.log | tee canary-verdict.txt
          grep -q "CANARY_VERDICT=UPSTREAM_V2_FACTORY_BLOCKED" canary-verdict.txt \
            || { echo "::error::canary verdict was not UPSTREAM_V2_FACTORY_BLOCKED — see log above"; exit 1; }
      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-canary-evidence
          path: |
            canary.log
            canary-verdict.txt
          if-no-files-found: warn

  # ── STATIC ANALYSIS ──────────────────────────────────────────────────────
  # Two separately classified scopes; failures are never silently swallowed.
  static-analysis:
    name: forge lint (test/ required-zero; upstream advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Parser regression tests (L1–L9)
        run: bash scripts/test-lint-gate.sh
      - name: "Lint Forge-authored test code (required: zero findings)"
        # No `|| true` anywhere: a forge lint invocation failure fails the
        # step. The strict NDJSON parser (fail-closed) decides the verdict —
        # malformed output can never pass.
        run: |
          set -euo pipefail
          forge lint test --json > test-lint.json
          perl scripts/check-test-lint.pl test-lint.json
      - name: Lint inherited upstream sources (advisory, reported in full)
        if: always()
        run: |
          # Inherited upstream code carries its own lint posture; reformatting
          # or "fixing" it is out of scope for a fork-intake PR. Findings are
          # recorded verbatim as annotations + artifacts so nothing is
          # silently swallowed.
          forge lint contractsV1/src contractsV2/src > upstream-lint.log 2>&1 || true
          count=$(grep -cE "warning\[|error\[" upstream-lint.log || true)
          echo "UPSTREAM_LINT_FINDINGS=$count" >> "$GITHUB_ENV"
          echo "::notice::inherited upstream lint findings: $count (advisory; upstream sources are unmodified in this fork — see docs/LICENSE-INVENTORY.md)"
          tail -40 upstream-lint.log || true
      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-evidence
          path: |
            test-lint.json
            upstream-lint.log
          if-no-files-found: warn
